  kdsingleapplication_sha256sum: 'e3254ce9dc5ecf6d61ef83264bc61d486a307f0e3c9ed1bb2176f068cdbcbe09'

  macdeploytool_version: 'ce0f075298d580eb0e92d0ccdcb5300365dde732'

  sparkle_version: '2.10.1'
  sparkle_sha256sum: '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27'

  sparsehash_version: '2.0.4'
  sparsehash_sha256sum: '8cd1a95827dfd8270927894eb77f62b4087735cbede953884647f16c521c7e58'

  googletest_version: '1.18.0'
  googletest_sha256sum: '6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5'

  max_releases: '6'

  curl_options: '-f -O -L --connect-timeout 60 -m 900 --retry 15 --retry-delay 10 --retry-max-time 300 --retry-all-errors'

  sourceforge_mirror: 'downloads.sourceforge.net'

  sourceforge_mirror2: 'netcologne.dl.sourceforge.net'

  qt_mirror: 'mirrors.ukfast.co.uk/sites/qt.io'

  cmake_loglevel: 'DEBUG'

  make_jobs: '4'

  PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: '1'

  PKG_CONFIG_ALLOW_SYSTEM_LIBS: '1'

  rust_toolchain_version: '1.96.0'

  cargo_c_version: '0.10.22+cargo-0.96.0'

jobs:

  build:
    name: Build

    if: (!contains(github.event.head_commit.message, 'skip ci'))

    strategy:
      matrix:
        runner:
          - ${{github.repository == 'strawberrymusicplayer/strawberry-macos-dependencies-private' && 'macos-arm64' || github.repository == 'strawberrymusicplayer/strawberry-macos-dependencies-legacy' && 'macos-15-intel' || github.repository == 'strawberrymusicplayer/strawberry-macos-dependencies-compat-private' && 'macos-intel' || 'macos-15'}}
        buildtype: [ release, debug ]

    runs-on: ${{matrix.runner}}

    outputs:
      release_tag: ${{steps.set_release_tag.outputs.release_tag}}

    # Stay below the 6 hour hard limit so the ccache is still saved if the build times out.
    timeout-minutes: ${{matrix.runner == 'macos-15-intel' && 340 || 360}}

    steps:

      - name: Set release tag
        id: set_release_tag
        shell: bash
        run: echo "release_tag=0.1.${{github.run_number}}" >> $GITHUB_OUTPUT

      - name: Set runner
        shell: bash
        run: echo "runner=${{matrix.runner}}" >> $GITHUB_ENV

      - name: Set arch
        shell: bash
        run: echo "arch=$(uname -m)" >> $GITHUB_ENV

      - name: Set buildtype
        shell: bash
        run: echo "buildtype=$(echo ${{matrix.buildtype}} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set cmake and meson buildtype
        shell: bash
        run: |
          echo "cmake_buildtype=$(echo ${{env.buildtype}} | awk '{print toupper(substr($0,0,1))tolower(substr($0,2))}')" >> $GITHUB_ENV
          echo "meson_buildtype=${{env.buildtype}}" >> $GITHUB_ENV

      - name: Set prefix path
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release'
        shell: bash
        run: echo "prefix_path=/opt/strawberry_macos_${{env.arch}}_${{env.buildtype}}" >> $GITHUB_ENV

      - name: Set prefix path
        if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/release'
        shell: bash
        run: echo "prefix_path=${GITHUB_WORKSPACE}/strawberry_macos_${{env.arch}}_${{env.buildtype}}" >> $GITHUB_ENV

      - name: Set build variables
        shell: bash
        run: |
          echo "PKG_CONFIG_EXECUTABLE=${{env.prefix_path}}/bin/pkgconf" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{env.prefix_path}}/lib/pkgconfig" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${{env.prefix_path}}/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${{env.prefix_path}}/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=${{env.prefix_path}}/lib" >> $GITHUB_ENV
          echo "CFLAGS=-I${{env.prefix_path}}/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-I${{env.prefix_path}}/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L${{env.prefix_path}}/lib -Wl,-rpath,${{env.prefix_path}}/lib" >> $GITHUB_ENV

      - name: Set compat versions
        if: env.runner == 'macos-intel'
        shell: bash
        run: |
          echo "qt_version=${{env.qt_version_compat}}" >> $GITHUB_ENV
          echo "qtbase_sha256sum=${{env.qtbase_compat_sha256sum}}" >> $GITHUB_ENV
          echo "qttools_sha256sum=${{env.qttools_compat_sha256sum}}" >> $GITHUB_ENV
          echo "qtimageformats_sha256sum=${{env.qtimageformats_compat_sha256sum}}" >> $GITHUB_ENV

      - name: Set MACOSX_DEPLOYMENT_TARGET
        shell: bash
        run: |
          # Use the minimum macOS version for the runner, raised to the minimum supported by the Qt version.
          min_version="${{env.runner == 'macos-intel' && '10.15' || '13.0'}}"
          qt_min_version=$(curl -s -f -L --retry 5 "https://raw.githubusercontent.com/qt/qtbase/v${{env.qt_version}}/.cmake.conf" | sed -n 's,^set(QT_SUPPORTED_MIN_MACOS_VERSION "\([0-9.]*\)").*,\1,p')
          if [ "${qt_min_version}" = "" ]; then
            qt_min_version=$(curl -s -f -L --retry 5 "https://raw.githubusercontent.com/qt/qtbase/v${{env.qt_version}}/mkspecs/common/macx.conf" | sed -n 's,^QMAKE_MACOSX_DEPLOYMENT_TARGET = \([0-9.]*\).*,\1,p')
          fi
          if [ "${qt_min_version}" = "" ]; then
            echo "Could not get the minimum macOS version for Qt ${{env.qt_version}}."
            exit 1
          fi
          deployment_target=$(printf '%s\n%s\n' "${min_version}" "${qt_min_version}" | sort -t . -k 1,1n -k 2,2n | tail -1)
          if ! echo "${deployment_target}" | grep -q '\.'; then
            deployment_target="${deployment_target}.0"
          fi
          echo "Qt ${{env.qt_version}} minimum macOS version: ${qt_min_version}, using MACOSX_DEPLOYMENT_TARGET ${deployment_target}"
          echo "MACOSX_DEPLOYMENT_TARGET=${deployment_target}" >> $GITHUB_ENV

      - name: Verify SDK
        shell: bash
        run: |
          sdk_path="$(xcrun --show-sdk-path)"
          echo "Using SDK ${sdk_path} with MACOSX_DEPLOYMENT_TARGET ${MACOSX_DEPLOYMENT_TARGET}"
          plutil -extract SupportedTargets.macosx.ValidDeploymentTargets json -o - "${sdk_path}/SDKSettings.json" | grep -q "\"${MACOSX_DEPLOYMENT_TARGET}\""

      - name: Set extra version variables
        shell: bash
        run: |
          echo "glib_version_short=$(echo ${{env.glib_version}} | cut -d '.' -f 1-2)" >> $GITHUB_ENV
          echo "glib_networking_version_short=$(echo ${{env.glib_networking_version}} | cut -d '.' -f 1-2)" >> $GITHUB_ENV
          echo "libsoup_version_short=$(echo ${{env.libsoup_version}} | cut -d '.' -f 1-2)" >> $GITHUB_ENV
          echo "qt_version_short=$(echo ${{env.qt_version}} | cut -d '.' -f 1-2)" >> $GITHUB_ENV
          echo "gnutls_version_short=$(echo ${{env.gnutls_version}} | cut -d '.' -f 1-2)" >> $GITHUB_ENV
