        shell: bash
        run: sudo chown ${USER}:staff ${{env.prefix_path}}

      - name: Create directories
        shell: bash
        run: mkdir -p ${{env.prefix_path}}/{bin,lib,include}

      - name: Update PATH
        shell: bash
        run: echo "${{env.prefix_path}}/bin" >> $GITHUB_PATH


      - name: Install ccache
        if: env.runner == 'macos-15-intel' || env.runner == 'macos-15'
        shell: bash
        run: |
          if ! command -v ccache &> /dev/null; then
            curl -f -L -o ccache.tar.gz https://github.com/ccache/ccache/releases/download/v${{env.ccache_version}}/ccache-${{env.ccache_version}}-darwin.tar.gz
            echo "${{env.ccache_sha256sum}} *ccache.tar.gz" | shasum -a 256 -c -
            tar -xf ccache.tar.gz
            sudo cp ccache-${{env.ccache_version}}-darwin/ccache ${{env.prefix_path}}/bin/
            sudo chmod +x ${{env.prefix_path}}/bin/ccache
          fi
          ccache --version
          echo "CCACHE_DIR=$(ccache --show-config | grep '.* cache_dir' | tr -d '[:blank:]' | cut -d '=' -f 2)" >> $GITHUB_ENV

      - name: Restore ccache
        if: env.runner == 'macos-15-intel'
        uses: actions/cache/restore@v6
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-macos-${{env.arch}}-${{env.buildtype}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            ccache-macos-${{env.arch}}-${{env.buildtype}}-

      - name: Configure ccache
        if: env.runner == 'macos-15-intel'
        shell: bash
        run: |
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=compiler_type=clang
          ccache --zero-stats
          ccache --show-stats

      - name: Setup ccache compiler masquerading
        if: env.runner == 'macos-15-intel'
        shell: bash
        run: |
          # Symlinks named after the compilers that point to ccache, placed first in PATH.
          # This makes every build system use ccache without changing the compiler name seen by configure or libtool.
          mkdir -p "${RUNNER_TEMP}/ccache-bin"
          for compiler in cc c++ gcc g++ clang clang++; do
            ln -sf "$(command -v ccache)" "${RUNNER_TEMP}/ccache-bin/${compiler}"
          done
          echo "${RUNNER_TEMP}/ccache-bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Verify ccache compiler masquerading
        if: env.runner == 'macos-15-intel'
        shell: bash
        run: |
          which -a clang gcc
