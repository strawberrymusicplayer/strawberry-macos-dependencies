        run: cmake --log-level="${{env.cmake_loglevel}}" -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE="${{env.cmake_buildtype}}" -DCMAKE_INSTALL_PREFIX="${{env.prefix_path}}" -DBUILD_SHARED_LIBS=ON -DKDSingleApplication_QT6=ON

      - name: Build KDSingleApplication
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/kdsingleapplication-${{env.kdsingleapplication_version}}/build
        run: cmake --build .

      - name: Install KDSingleApplication
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/kdsingleapplication-${{env.kdsingleapplication_version}}/build
        run: cmake --install .

      - name: Mark KDSingleApplication as built
        if: env.runner == 'macos-intel' && env.skip_lib != 'true'
        shell: bash
        run: |
          # Libraries later in the build order may depend on this one, clear them so they are rebuilt.
          mkdir -p "${{env.prefix_path}}/.built"
          for marker in "${{env.prefix_path}}/.built"/*; do
            if [ -f "${marker}" ] && [ "$(cat "${marker}")" -gt "${lib_index}" ] 2>/dev/null; then
              echo "Clearing $(basename "${marker}")"
              rm -f "${marker}"
            fi
          done
          echo "${lib_index}" > "${{env.prefix_path}}/.built/kdsingleapplication-${{env.kdsingleapplication_version}}"


      - name: Check if googletest is already built
        if: env.runner == 'macos-intel'
        shell: bash
        run: |
          lib_index=$((${lib_index:-0} + 1))
          echo "lib_index=${lib_index}" >> $GITHUB_ENV
          if [ -s "${{env.prefix_path}}/.built/googletest-${{env.googletest_version}}" ]; then
            echo "googletest ${{env.googletest_version}} is already built, skipping."
            echo "skip_lib=true" >> $GITHUB_ENV
          else
            echo "skip_lib=false" >> $GITHUB_ENV
          fi

      - name: Download googletest
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: downloads
        run: |
          curl ${{env.curl_options}} https://github.com/google/googletest/releases/download/v${{env.googletest_version}}/googletest-${{env.googletest_version}}.tar.gz || \
          curl ${{env.curl_options}} https://packages.strawberrymusicplayer.org/googletest-${{env.googletest_version}}.tar.gz

      - name: Verify googletest
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: downloads
        run: echo "${{env.googletest_sha256sum}} *googletest-${{env.googletest_version}}.tar.gz" | shasum -a 256 -c -

      - name: Extract googletest
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build
        run: tar -xf ../downloads/googletest-${{env.googletest_version}}.tar.gz

      - name: Configure googletest
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/googletest-${{env.googletest_version}}
        run: cmake --log-level="${{env.cmake_loglevel}}" -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE="${{env.cmake_buildtype}}" -DCMAKE_INSTALL_PREFIX="${{env.prefix_path}}" -DBUILD_SHARED_LIBS=ON -DBUILD_GMOCK=ON -DINSTALL_GTEST=ON

      - name: Build googletest
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/googletest-${{env.googletest_version}}/build
        run: cmake --build . --parallel ${{env.make_jobs}}

      - name: Install googletest
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/googletest-${{env.googletest_version}}/build
        run: cmake --install .

      - name: Mark googletest as built
        if: env.runner == 'macos-intel' && env.skip_lib != 'true'
        shell: bash
        run: |
          # Libraries later in the build order may depend on this one, clear them so they are rebuilt.
          mkdir -p "${{env.prefix_path}}/.built"
          for marker in "${{env.prefix_path}}/.built"/*; do
            if [ -f "${marker}" ] && [ "$(cat "${marker}")" -gt "${lib_index}" ] 2>/dev/null; then
              echo "Clearing $(basename "${marker}")"
              rm -f "${marker}"
            fi
          done
          echo "${lib_index}" > "${{env.prefix_path}}/.built/googletest-${{env.googletest_version}}"


      - name: Check if macdeploytool is already built
        if: env.runner == 'macos-intel'
        shell: bash
        run: |
          lib_index=$((${lib_index:-0} + 1))
          echo "lib_index=${lib_index}" >> $GITHUB_ENV
          if [ -s "${{env.prefix_path}}/.built/macdeploytool-${{env.macdeploytool_version}}" ]; then
            echo "macdeploytool ${{env.macdeploytool_version}} is already built, skipping."
            echo "skip_lib=true" >> $GITHUB_ENV
          else
            echo "skip_lib=false" >> $GITHUB_ENV
          fi

      - name: Download macdeploytool
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build
        run: |
          git clone https://github.com/jonaski/macdeploytool
          cd macdeploytool
          git checkout ${{env.macdeploytool_version}}

      - name: Configure macdeploytool
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/macdeploytool
        run: cmake --log-level="${{env.cmake_loglevel}}" -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE="${{env.cmake_buildtype}}" -DCMAKE_INSTALL_PREFIX="${{env.prefix_path}}"

      - name: Build macdeploytool
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/macdeploytool/build
        run: cmake --build .

      - name: Install macdeploytool
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/macdeploytool/build
        run: cmake --install .

      - name: Mark macdeploytool as built
        if: env.runner == 'macos-intel' && env.skip_lib != 'true'
        shell: bash
        run: |
          # Libraries later in the build order may depend on this one, clear them so they are rebuilt.
          mkdir -p "${{env.prefix_path}}/.built"
          for marker in "${{env.prefix_path}}/.built"/*; do
            if [ -f "${marker}" ] && [ "$(cat "${marker}")" -gt "${lib_index}" ] 2>/dev/null; then
              echo "Clearing $(basename "${marker}")"
              rm -f "${marker}"
            fi
          done
          echo "${lib_index}" > "${{env.prefix_path}}/.built/macdeploytool-${{env.macdeploytool_version}}"


      - name: Cleanup build directory
        if: env.runner == 'macos-15-intel' || env.runner == 'macos-15'
        shell: bash
        working-directory: build
        run: rm -rf *


      - name: Check if create-dmg is already built
        if: env.runner == 'macos-intel'
        shell: bash
        run: |
          lib_index=$((${lib_index:-0} + 1))
          echo "lib_index=${lib_index}" >> $GITHUB_ENV
          if [ -s "${{env.prefix_path}}/.built/create-dmg" ]; then
            echo "create-dmg is already built, skipping."
            echo "skip_lib=true" >> $GITHUB_ENV
          else
            echo "skip_lib=false" >> $GITHUB_ENV
          fi

      - name: Clone create-dmg
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build
        run: git clone https://github.com/create-dmg/create-dmg.git

      - name: Change create-dmg prefix
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/create-dmg
        run: sed -i .bak "s,^prefix = .*,prefix = ${{env.prefix_path}},g" Makefile

      - name: Install create-dmg
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/create-dmg
        run: make install

      - name: Mark create-dmg as built
        if: env.runner == 'macos-intel' && env.skip_lib != 'true'
        shell: bash
        run: |
          # Libraries later in the build order may depend on this one, clear them so they are rebuilt.
          mkdir -p "${{env.prefix_path}}/.built"
          for marker in "${{env.prefix_path}}/.built"/*; do
            if [ -f "${marker}" ] && [ "$(cat "${marker}")" -gt "${lib_index}" ] 2>/dev/null; then
              echo "Clearing $(basename "${marker}")"
              rm -f "${marker}"
            fi
          done
          echo "${lib_index}" > "${{env.prefix_path}}/.built/create-dmg"


      - name: Check if sparkle is already built
        if: env.runner == 'macos-intel'
        shell: bash
        run: |
          lib_index=$((${lib_index:-0} + 1))
          echo "lib_index=${lib_index}" >> $GITHUB_ENV
          if [ -s "${{env.prefix_path}}/.built/sparkle-${{env.sparkle_version}}" ]; then
            echo "sparkle ${{env.sparkle_version}} is already built, skipping."
            echo "skip_lib=true" >> $GITHUB_ENV
          else
            echo "skip_lib=false" >> $GITHUB_ENV
          fi

      - name: Download sparkle
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: downloads
        run: |
          curl ${{env.curl_options}} https://github.com/sparkle-project/Sparkle/releases/download/${{env.sparkle_version}}/Sparkle-${{env.sparkle_version}}.tar.xz || \
          curl ${{env.curl_options}} https://packages.strawberrymusicplayer.org/Sparkle-${{env.sparkle_version}}.tar.xz

      - name: Verify sparkle
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: downloads
        run: echo "${{env.sparkle_sha256sum}} *Sparkle-${{env.sparkle_version}}.tar.xz" | shasum -a 256 -c -

      - name: Extract sparkle
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build
        run: |
          mkdir sparkle
          cd sparkle
          tar -xf ../../downloads/Sparkle-${{env.sparkle_version}}.tar.xz

      - name: Install sparkle
        if: env.skip_lib != 'true'
        shell: bash
        working-directory: build/sparkle
        run: cp -R Sparkle.framework ${{env.prefix_path}}/lib/

      - name: Mark sparkle as built
        if: env.runner == 'macos-intel' && env.skip_lib != 'true'
        shell: bash
        run: |
          # Libraries later in the build order may depend on this one, clear them so they are rebuilt.
          mkdir -p "${{env.prefix_path}}/.built"
          for marker in "${{env.prefix_path}}/.built"/*; do
            if [ -f "${marker}" ] && [ "$(cat "${marker}")" -gt "${lib_index}" ] 2>/dev/null; then
              echo "Clearing $(basename "${marker}")"
              rm -f "${marker}"
            fi
          done
          echo "${lib_index}" > "${{env.prefix_path}}/.built/sparkle-${{env.sparkle_version}}"


      - name: Cleanup build directory
        if: env.runner == 'macos-15-intel' || env.runner == 'macos-15'
        shell: bash
        working-directory: build
        run: rm -rf *


      - name: Show ccache statistics
        if: always() && env.runner == 'macos-15-intel'
        shell: bash
        run: ccache --show-stats

      - name: Save ccache
        if: always() && env.runner == 'macos-15-intel'
        uses: actions/cache/save@v6
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-macos-${{env.arch}}-${{env.buildtype}}-${{github.run_id}}-${{github.run_attempt}}

      - name: Create archive
        shell: bash
        run: tar -cJf strawberry-macos-${{env.arch}}-${{env.buildtype}}.tar.xz --exclude '*/.built' ${{env.prefix_path}}

      - name: Set have release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: echo "have_release=$(gh release view "${{steps.set_release_tag.outputs.release_tag}}" | grep "${{steps.set_release_tag.outputs.release_tag}}" >/dev/null 2>&1 && echo 1 || echo 0)" >> $GITHUB_ENV

      - name: Set release notes file
        run: echo "release_notes_file=release_notes.txt" >> $GITHUB_ENV

      - name: Create release notes
        run: |
          echo "Strawberry macOS Dependencies Release ${{steps.set_release_tag.outputs.release_tag}}" > "${{env.release_notes_file}}"
          echo "" >> "${{env.release_notes_file}}"
          echo "Libraries:" >> "${{env.release_notes_file}}"
          echo "" >> "${{env.release_notes_file}}"
          echo "* PkgConf ${{env.pkgconf_version}}" >> "${{env.release_notes_file}}"
          echo "* proxy-libintl ${{env.proxy_libintl_version}}" >> "${{env.release_notes_file}}"
          echo "* sparsehash ${{env.sparsehash_version}}" >> "${{env.release_notes_file}}"
          echo "* gmp ${{env.gmp_version}}" >> "${{env.release_notes_file}}"
          echo "* nasm ${{env.nasm_version}}" >> "${{env.release_notes_file}}"
          echo "* yasm ${{env.yasm_version}}" >> "${{env.release_notes_file}}"
          echo "* zlib ${{env.zlib_version}}" >> "${{env.release_notes_file}}"
          echo "* openssl ${{env.openssl_version}}" >> "${{env.release_notes_file}}"
          echo "* libpng ${{env.libpng_version}}" >> "${{env.release_notes_file}}"
          echo "* libjpeg-turbo ${{env.libjpeg_turbo_version}}" >> "${{env.release_notes_file}}"
          echo "* PCRE2 ${{env.pcre2_version}}" >> "${{env.release_notes_file}}"
          echo "* bzip2 ${{env.bzip2_version}}" >> "${{env.release_notes_file}}"
          echo "* xz ${{env.xz_version}}" >> "${{env.release_notes_file}}"
          echo "* Brotli ${{env.brotli_version}}" >> "${{env.release_notes_file}}"
          echo "* zstd ${{env.zstd_version}}" >> "${{env.release_notes_file}}"
          echo "* libunistring ${{env.libunistring_version}}" >> "${{env.release_notes_file}}"
          echo "* libtasn1 ${{env.libtasn1_version}}" >> "${{env.release_notes_file}}"
          echo "* libidn2 ${{env.libidn2_version}}" >> "${{env.release_notes_file}}"
          echo "* Nettle ${{env.nettle_version}}" >> "${{env.release_notes_file}}"
          echo "* GnuTLS ${{env.gnutls_version}}" >> "${{env.release_notes_file}}"
          echo "* uchardet ${{env.uchardet_version}}" >> "${{env.release_notes_file}}"
          echo "* ICU4C ${{env.icu4c_version}}" >> "${{env.release_notes_file}}"
          echo "* pixman ${{env.pixman_version}}" >> "${{env.release_notes_file}}"
          echo "* Expat ${{env.expat_version}}" >> "${{env.release_notes_file}}"
          echo "* libxml2 ${{env.libxml2_version}}" >> "${{env.release_notes_file}}"
          echo "* nghttp2 ${{env.nghttp2_version}}" >> "${{env.release_notes_file}}"
          echo "* libffi ${{env.libffi_version}}" >> "${{env.release_notes_file}}"
          echo "* libpsl ${{env.libpsl_version}}" >> "${{env.release_notes_file}}"
          echo "* orc ${{env.orc_version}}" >> "${{env.release_notes_file}}"
          echo "* SQLite ${{env.sqlite3_version}}" >> "${{env.release_notes_file}}"
          echo "* GLib ${{env.glib_version}}" >> "${{env.release_notes_file}}"
          echo "* gdk-pixbuf ${{env.gdk_pixbuf_version}}" >> "${{env.release_notes_file}}"
          echo "* libsoup ${{env.libsoup_version}}" >> "${{env.release_notes_file}}"
          echo "* GLib Networking ${{env.glib_networking_version}}" >> "${{env.release_notes_file}}"
          echo "* FreeType ${{env.freetype_version}}" >> "${{env.release_notes_file}}"
          echo "* Harfbuzz ${{env.harfbuzz_version}}" >> "${{env.release_notes_file}}"
          echo "* JasPer ${{env.jasper_version}}" >> "${{env.release_notes_file}}"
          echo "* libtiff ${{env.tiff_version}}" >> "${{env.release_notes_file}}"
          echo "* libwebp ${{env.libwebp_version}}" >> "${{env.release_notes_file}}"
          echo "* libusb ${{env.libusb_version}}" >> "${{env.release_notes_file}}"
          echo "* libogg ${{env.libogg_version}}" >> "${{env.release_notes_file}}"
          echo "* libvorbis ${{env.libvorbis_version}}" >> "${{env.release_notes_file}}"
          echo "* FLAC ${{env.flac_version}}" >> "${{env.release_notes_file}}"
          echo "* WavPack ${{env.wavpack_version}}" >> "${{env.release_notes_file}}"
          echo "* Opus Codec ${{env.opus_version}}" >> "${{env.release_notes_file}}"
          echo "* opusfile ${{env.opusfile_version}}" >> "${{env.release_notes_file}}"
          echo "* Speex ${{env.speex_version}}" >> "${{env.release_notes_file}}"
          echo "* mpg123 ${{env.mpg123_version}}" >> "${{env.release_notes_file}}"
          echo "* LAME ${{env.lame_version}}" >> "${{env.release_notes_file}}"
          echo "* Musepack ${{env.musepack_version}}" >> "${{env.release_notes_file}}"
          echo "* libopenmpt ${{env.libopenmpt_version}}" >> "${{env.release_notes_file}}"
          echo "* libgme ${{env.libgme_version}}" >> "${{env.release_notes_file}}"
          echo "* faad2 ${{env.faad2_version}}" >> "${{env.release_notes_file}}"
          echo "* faac ${{env.faac_version}}" >> "${{env.release_notes_file}}"
          echo "* fdk-aac ${{env.fdk_aac_version}}" >> "${{env.release_notes_file}}"
          echo "* utfcpp ${{env.utfcpp_version}}" >> "${{env.release_notes_file}}"
          echo "* TagLib ${{env.taglib_version}}" >> "${{env.release_notes_file}}"
          echo "* libbs2b ${{env.libbs2b_version}}" >> "${{env.release_notes_file}}"
          echo "* libebur128 ${{env.libebur128_version}}" >> "${{env.release_notes_file}}"
          echo "* FFTW ${{env.fftw_version}}" >> "${{env.release_notes_file}}"
          echo "* ffmpeg ${{env.ffmpeg_version}}" >> "${{env.release_notes_file}}"
          echo "* Chromaprint ${{env.chromaprint_version}}" >> "${{env.release_notes_file}}"
          echo "* libcdio ${{env.libcdio_version}}" >> "${{env.release_notes_file}}"
          echo "* GStreamer ${{env.gstreamer_version}}" >> "${{env.release_notes_file}}"
          echo "* gst-plugins-rs ${{env.gstreamer_plugins_rs_version}}" >> "${{env.release_notes_file}}"
          echo "* libplist ${{env.libplist_version}}" >> "${{env.release_notes_file}}"
          echo "* libmtp ${{env.libmtp_version}}" >> "${{env.release_notes_file}}"
          echo "* libgpod ${{env.libgpod_version}}" >> "${{env.release_notes_file}}"
          echo "* Qt ${{env.qt_version}}" >> "${{env.release_notes_file}}"
          echo "* KDSingleApplication ${{env.kdsingleapplication_version}}" >> "${{env.release_notes_file}}"
          echo "* googletest ${{env.googletest_version}}" >> "${{env.release_notes_file}}"
          echo "* Sparkle ${{env.sparkle_version}}" >> "${{env.release_notes_file}}"

      - name: Create new release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') && env.have_release != '1'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: gh release create -d -F "${{env.release_notes_file}}" -t "Strawberry macOS Dependencies Release ${{steps.set_release_tag.outputs.release_tag}}" "${{steps.set_release_tag.outputs.release_tag}}" "strawberry-macos-${{env.arch}}-${{env.buildtype}}.tar.xz"

      - name: Update existing release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') && env.have_release == '1'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: gh release upload --clobber "${{steps.set_release_tag.outputs.release_tag}}" "strawberry-macos-${{env.arch}}-${{env.buildtype}}.tar.xz"


  publish-release:
    name: Publish Release
    runs-on: ${{github.repository == 'strawberrymusicplayer/strawberry-macos-dependencies-private' && 'macos-arm64' || github.repository == 'strawberrymusicplayer/strawberry-macos-dependencies-legacy' && 'macos-15-intel' || github.repository == 'strawberrymusicplayer/strawberry-macos-dependencies-compat-private' && 'macos-intel' || 'macos-15'}}
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release'
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: gh release edit --draft=false --latest "${{needs.build.outputs.release_tag}}"

      - name: Delete old releases
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          while [ "$(git tag | wc -l)" -ge "${{env.max_releases}}" ]; do
            oldest_tag=$(git tag | sort -V | head -1)
            if gh release view "${oldest_tag}" >/dev/null 2>&1; then
              gh release delete --yes "${oldest_tag}"
            fi
            git tag -d "${oldest_tag}"
            git push --delete origin "${oldest_tag}"
          done

